<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LLM Todo 角色</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <strong>LLM Todo 角色</strong>
        <span id="character-url">http://127.0.0.1:8720/character.html</span>
      </div>
      <nav>
        <a href="/">工作台</a>
        <a class="active" href="/character.html">角色</a>
        <a href="/design/">设计</a>
      </nav>
    </header>

    <main class="character-layout">
      <section class="doc-section character-hero">
        <div class="character-title">
          <span>当前角色</span>
          <h1 id="character-name">加载中</h1>
          <p id="character-level">等级 --</p>
        </div>
        <div class="xp-panel">
          <div class="progress-meta">
            <span>经验</span>
            <strong id="xp-label">-- / -- XP</strong>
          </div>
          <div class="meter" aria-label="经验进度">
            <span id="xp-bar"></span>
          </div>
          <p id="xp-note">读取经验数据中。</p>
        </div>
      </section>

      <section class="doc-section">
        <div class="character-section-head">
          <h2>六项能力</h2>
          <span>能力值按当前任务历史计算</span>
        </div>
        <div id="abilities-grid" class="ability-grid"></div>
      </section>

      <section class="character-bottom-grid">
        <section class="doc-section">
          <div class="character-section-head">
            <h2>成就墙</h2>
            <span id="achievement-count">-- / -- 已解锁</span>
          </div>
          <div id="achievements-grid" class="achievement-grid"></div>
        </section>

        <section class="doc-section week-panel">
          <div class="character-section-head">
            <h2>本周概览</h2>
            <span id="week-range">--</span>
          </div>
          <div class="week-total">
            <strong id="week-done">--</strong>
            <span>/</span>
            <strong id="week-total">--</strong>
          </div>
          <div class="meter" aria-label="本周完成进度">
            <span id="week-bar"></span>
          </div>
          <p id="week-note">本周完成数 / 总数</p>
        </section>
      </section>
    </main>

    <script src="/shared.js"></script>
    <script src="/character.js"></script>
  </body>
</html>
