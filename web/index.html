<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LLM Todo</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <strong>LLM Todo</strong>
        <span id="server-url">http://127.0.0.1:8720/</span>
      </div>
      <nav>
        <a class="active" href="/#tasks">📋 任务</a>
        <a href="/#planning">🗺️ 规划</a>
        <a href="/#chat">💬 聊天</a>
        <a href="/map">🧭 能力地图</a>
        <a href="/character">👤 角色</a>
      </nav>
    </header>

    <div id="reminder-banner" class="reminder-banner" hidden></div>

    <main class="workspace tab-workspace">
      <section class="task-column index-tab-panel" data-index-tab-panel="tasks">
        <div class="section-head">
          <div>
            <h1>任务</h1>
            <span id="task-count">加载中</span>
          </div>
          <select id="status-filter" aria-label="任务状态过滤">
            <option value="active">进行中</option>
            <option value="all">全部</option>
            <option value="waiting">等待中</option>
          </select>
        </div>
        <div id="view-tabs" class="view-tabs" role="tablist" aria-label="任务视图">
          <button type="button" class="active" data-task-view="tasks">当前</button>
          <button type="button" data-task-view="week">📅 本周计划</button>
          <button type="button" data-task-view="history">历史</button>
        </div>
        <section id="task-panel">
          <form id="quick-task-form" class="quick-task">
            <input id="quick-task-title" placeholder="快速新增任务，可加 标签: 复盘 #项目" />
            <button type="submit">新增</button>
          </form>
          <div class="task-tools">
            <input id="task-search" placeholder="搜索任务标题" aria-label="搜索任务标题" />
            <div class="filter-grid">
              <select id="horizon-filter" aria-label="时间尺度筛选"></select>
              <select id="area-filter" aria-label="领域筛选"></select>
              <select id="priority-filter" aria-label="优先级筛选"></select>
              <select id="tag-filter" aria-label="标签筛选"></select>
              <select id="type-filter" aria-label="类型筛选"></select>
            </div>
          </div>
          <div id="batch-bar" class="batch-bar" hidden>
            <span id="batch-count">已选择 0 个任务</span>
            <button type="button" data-batch-status="done">批量完成</button>
            <button type="button" data-batch-status="dropped">批量放弃</button>
          </div>
          <div id="task-list" class="task-list"></div>
        </section>
        <section id="history-panel" hidden>
          <div id="history-list" class="task-list history-list"></div>
        </section>
        <section id="week-panel" hidden>
          <div class="week-header">
            <div class="week-title-row">
              <h2>📅 本周计划</h2>
              <span id="week-range" class="week-range"></span>
            </div>
            <div class="week-progress" id="week-progress"></div>
          </div>
          <div id="week-grid" class="week-grid"></div>
        </section>
      </section>

      <section class="planning-column index-tab-panel" data-index-tab-panel="planning" hidden>
        <div class="planning-tab-head">
          <div>
            <h1>规划</h1>
            <span>时间尺度文档 · 规划文档阅读</span>
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <a href="/map">🧭 能力地图</a>
            <a href="/character">👤 角色</a>
            <button type="button" id="sync-remote-btn" style="background:#205a4f;color:#fff;border-color:#205a4f;min-height:38px;padding:0 14px;font-weight:600;" title="同步代码到远程服务器">🔄 同步</button>
          </div>
        </div>
        <div class="stat-strip" id="stat-strip"></div>
        <section class="horizon-band" id="horizon-band"></section>
        <div class="planning-quick-links" style="display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;">
          <a href="/map" class="quick-link-card" style="flex:1;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:var(--radius);padding:10px;text-decoration:none;color:var(--ink);background:var(--panel-soft);min-height:56px;">
            <span style="font-size:24px;">🧭</span>
            <div><strong>能力地图</strong><br><span style="color:var(--muted);font-size:13px;">能力域 · 路线图 · Agent 状态</span></div>
          </a>
          <a href="/character" class="quick-link-card" style="flex:1;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:var(--radius);padding:10px;text-decoration:none;color:var(--ink);background:var(--panel-soft);min-height:56px;">
            <span style="font-size:24px;">👤</span>
            <div><strong>角色页</strong><br><span style="color:var(--muted);font-size:13px;">技能树 · 能力标签 · 任务动态</span></div>
          </a>
        </div>
        <div class="doc-shell">
          <aside class="doc-list" id="doc-list"></aside>
          <article class="doc-reader markdown" id="doc-reader"></article>
        </div>
      </section>

      <section class="chat-column index-tab-panel" data-index-tab-panel="chat" hidden>
        <div class="chat-head">
          <div>
            <h2>聊天入口</h2>
            <span>上下文来自任务、时间尺度和领域页面</span>
          </div>
          <select id="provider-select" aria-label="模型提供方"></select>
        </div>
        <div id="chat-messages" class="chat-messages"></div>
        <form id="chat-form" class="chat-form">
          <textarea id="chat-input" placeholder="例如：今天下一步是什么？或：新增任务 这周整理年度规划"></textarea>
          <button type="submit">发送</button>
        </form>
      </section>
    </main>

    <div id="task-modal" class="modal-backdrop" hidden>
      <form id="task-edit-form" class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="task-edit-title">
        <div class="modal-head">
          <div>
            <h2 id="task-edit-title">编辑任务</h2>
            <span id="task-edit-meta">更新任务字段</span>
          </div>
          <button type="button" class="icon-button" id="task-edit-close" aria-label="关闭">×</button>
        </div>
        <div class="form-grid">
          <label class="full-field">
            标题
            <input id="edit-title" required maxlength="160" />
          </label>
          <label>
            截止日期
            <input id="edit-due" type="date" />
          </label>
          <label>
            优先级
            <select id="edit-priority">
              <option value="high">高</option>
              <option value="medium">中</option>
              <option value="low">低</option>
            </select>
          </label>
          <label>
            时间尺度
            <select id="edit-horizon">
              <option value="today">今天</option>
              <option value="week">本周</option>
              <option value="month">本月</option>
              <option value="quarter">季度</option>
              <option value="year">年度</option>
              <option value="decade">十年</option>
              <option value="lifetime">人生</option>
            </select>
          </label>
          <label>
            重复
            <select id="edit-repeat">
              <option value="">不重复</option>
              <option value="daily">每天</option>
              <option value="weekly">每周</option>
              <option value="monthly">每月</option>
              <option value="quarterly">每季度</option>
              <option value="yearly">每年</option>
            </select>
          </label>
          <label>
            领域
            <input id="edit-area" maxlength="40" />
          </label>
          <label>
            类型
            <select id="edit-type">
              <option value="personal">个人</option>
              <option value="agent">Agent</option>
              <option value="review">评审</option>
              <option value="discuss">讨论</option>
            </select>
          </label>
          <label>
            标签
            <input id="edit-tags" placeholder="用空格、逗号分隔" />
          </label>
          <label class="full-field">
            下一步
            <input id="edit-next-action" maxlength="220" />
          </label>
          <label class="full-field">
            备注
            <textarea id="edit-notes" rows="5" maxlength="500"></textarea>
          </label>
        </div>
        <div class="modal-actions">
          <button type="button" id="task-edit-cancel">取消</button>
          <button type="submit">保存</button>
        </div>
      </form>
    </div>

    <script src="/shared.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
